services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?Set BASIC_AUTH_USER in .env.production}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?Set BASIC_AUTH_HASH in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  backend:
    ports: []
    expose:
      - "8000"
    environment:
      APP_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env.production}
      COOKIE_SECURE: "true"
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY in .env.production}
      MAX_CONCURRENT_BUILDS: ${MAX_CONCURRENT_BUILDS:-3}
      MAX_BUILD_TOKENS: ${MAX_BUILD_TOKENS:-80000}
      ALLOW_SHARED_PROVIDER_KEYS: "false"

  frontend:
    ports: []
    expose:
      - "3000"
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env.production}

volumes:
  caddy-data:
  caddy-config:
